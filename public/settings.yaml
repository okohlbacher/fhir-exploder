fhir:
  serverUrl: "http://localhost:8080/fhir"
  auth:
    mode: open
    # username / password: for basic auth
    # token: for bearer auth

terminology:
  # Default: public CSIRO Ontoserver R4 sandbox (CORS-enabled, anonymous).
  # $lookup / $translate / $expand all supported. Safe dev default.
  serverUrl: "https://r4.ontoserver.csiro.au/fhir"

  # Production MII Terminology Server. Requires mTLS (DFN-issued client cert).
  # Browser SPAs cannot authenticate directly — operators must front-terminate
  # TLS via a reverse proxy or use a local Ontoserver mirror.
  # serverUrl: "https://terminology.medizininformatik-initiative.de/fhir"

# Plausibility check thresholds
# plausibility:
#   maxAge: 150
#   maxEncounterDays: 365

# Lab reference ranges (keyed by LOINC code)
# Config ranges override Observation.referenceRange from FHIR data
# referenceRanges:
#   "2093-3":    # Total Cholesterol
#     low: 0
#     high: 300
#     unit: "mg/dL"
#   "2571-8":    # Triglycerides
#     low: 0
#     high: 500
#     unit: "mg/dL"

# External FHIR validator cascade (Phase 31 UX-01 + Phase 43 VAL-06/VAL-07)
# Enables a 3-tier cascade: external → server $validate → local checker.
# Every external call is PHI-gated (acknowledge PHI flow before first
# fetch) and AbortController-wrapped with a 15-second default timeout.
# The optional `label` overrides the URL-pattern heuristic that picks
# the variant suffix shown in the status line (HAPI / Firely / IG-Publisher).
# validation:
#   externalValidator:
#     url: "https://hapi.fhir.org/baseR4"
#     enabled: false         # set true to activate the external tier
#     timeoutMs: 15000       # optional; default 15000
#     label: ""              # optional; blank = auto-detect from URL
#
#     # Phase 43 VAL-06 — HTTP authentication for protected validators.
#     # Basic-auth credentials are accepted as plaintext below (intentional;
#     # same trust boundary as the FHIR server URL above).
#     # auth:
#     #   type: basic
#     #   username: alice
#     #   password: secret
#     #
#     # Bearer tokens are entered via Settings → "Set bearer token" modal
#     # (NEVER set them here on disk — the parser silently drops any
#     # `token` / `credentials` / `password` fields when type is bearer).
#     # auth:
#     #   type: bearer
#
#     # Phase 43 VAL-07 — opt-in "Did you mean?" SNOMED/ICD-10 suggestions
#     # for `code-invalid` issues. Default false; set to true to walk the
#     # configured terminology server's $lookup hierarchy (depth 3, top 10).
#     # semanticNearMisses: false
