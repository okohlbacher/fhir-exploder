<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>FHIR Exploder — Layout Redesign</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="tokens.css"/>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  body { background: oklch(96% 0.005 85); }
  .screen-frame {
    width: 1280px;
    height: 820px;
    background: var(--bg);
    overflow: hidden;
    position: relative;
    font-size: 14px;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="view-dashboard.jsx"></script>
<script type="text/babel" src="view-patients.jsx"></script>
<script type="text/babel" src="view-patient-detail.jsx"></script>
<script type="text/babel" src="view-quality.jsx"></script>
<script type="text/babel" src="view-cohorts.jsx"></script>
<script type="text/babel" src="view-explorer.jsx"></script>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

function Frame({ children }) {
  return <div className="screen-frame">{children}</div>;
}

function App() {
  return (
    <DesignCanvas>
      <DCSection id="primary" title="Primary views" subtitle="Redesigned layouts — warm neutral surfaces, IBM Plex, indigo accent, denser data grids.">
        <DCArtboard id="dashboard" label="Dashboard" width={1280} height={820}>
          <Frame><DashboardView/></Frame>
        </DCArtboard>
        <DCArtboard id="patients" label="Patients · list" width={1280} height={820}>
          <Frame><PatientsView/></Frame>
        </DCArtboard>
        <DCArtboard id="patient-detail" label="Patients · detail" width={1280} height={820}>
          <Frame><PatientDetailView/></Frame>
        </DCArtboard>
        <DCArtboard id="explorer" label="Explorer" width={1280} height={820}>
          <Frame><ExplorerView/></Frame>
        </DCArtboard>
      </DCSection>
      <DCSection id="quality" title="Quality">
        <DCArtboard id="quality-overview" label="Quality · overview" width={1280} height={820}>
          <Frame><QualityView/></Frame>
        </DCArtboard>
        <DCArtboard id="cohorts" label="Cohorts" width={1280} height={820}>
          <Frame><CohortsView/></Frame>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
